# 云台点位动作不再暂停底盘；到点任务和车辆信号分别由下方独立规则控制。
pause_on_arrival: false

# 台位分支任务完成后，等待此时间再重新启动本轮主干道任务。
branch:
  restart_delay: 0.8

# 仅用于云台动作。匹配顺序：精确点位覆盖 > 关键词首次匹配 > 默认规则。
# 云台随车点位规则，按顺序匹配；预置点速度1.0为设备允许的最高速度。
point_rules:
  - id: "initial"
    keywords: ["初始点", "原点", "待命点", "充电点"]
    preset: "1"
    speed: 1.0
    home: false
    sweep: false

  - id: "start"
    keywords: ["起始点", "起始"]
    preset: "2"
    speed: 1.0
    home: false
    sweep: false

  - id: "cruise"
    keywords: ["巡航点", "巡航"]
    preset: "3"
    speed: 1.0
    home: false
    sweep: true
    sweep_profile: "inspection_fast"

  - id: "preset4_interface"
    keywords: ["预置点4", "4号预置点", "四号预置点"]
    preset: "4"
    speed: 1.0
    home: false
    sweep: false

default_rule:
  preset: "4"
  speed: 1.0
  home: false
  sweep: false

# 精确点名接口；编号起始点由上面的关键词规则统一映射到2号预置点。
points:
  "初始点": {sequence: 0, preset: "1", speed: 1.0, home: false, sweep: false}
  "起始点": {sequence: 0, preset: "2", speed: 1.0, home: false, sweep: false}
  "巡航点": {sequence: 0, preset: "3", speed: 1.0, home: false, sweep: true, sweep_profile: "inspection_fast"}
  "预置点4": {sequence: 0, preset: "4", speed: 1.0, home: false, sweep: false}

arrival_tasks:
  "起始点01": {enabled: false, task_name: "", stop_before_start: true, return_to_main_task: true, loop_time: 1}
  "起始点02": {enabled: false, task_name: "", stop_before_start: true, return_to_main_task: true, loop_time: 1}
  "起始点03": {enabled: false, task_name: "", stop_before_start: true, return_to_main_task: true, loop_time: 1}
  "起始点04": {enabled: false, task_name: "", stop_before_start: true, return_to_main_task: true, loop_time: 1}

# 有车/无车信号的独立任务规则，不检查云台状态，也不要求先模拟到达。
vehicle_task_rules:
  "起始点01":
    on_vehicle: {action: "start_task", task_name: "台位1", stop_before_start: true, return_to_main_task: true}
    on_empty: {action: "continue"}
    on_error: {action: "none"}
  "起始点02":
    on_vehicle: {action: "start_task", task_name: "台位2", stop_before_start: true, return_to_main_task: true}
    on_empty: {action: "continue"}
    on_error: {action: "none"}
  "起始点03":
    on_vehicle: {action: "start_task", task_name: "台位3", stop_before_start: true, return_to_main_task: true}
    on_empty: {action: "continue"}
    on_error: {action: "none"}
  "起始点04":
    on_vehicle: {action: "start_task", task_name: "台位4", stop_before_start: true, return_to_main_task: true}
    on_empty: {action: "continue"}
    on_error: {action: "none"}
  "台位1左":
    on_vehicle: {action: "start_task", task_name: "台位1有车任务", stop_before_start: true}
    on_empty: {action: "start_task", task_name: "台位1无车任务", stop_before_start: true}
    on_error: {action: "none"}
  "台位2左":
    on_vehicle: {action: "continue"}
    on_empty: {action: "continue"}
    on_error: {action: "none"}
  "台位3右":
    on_vehicle: {action: "start_task", task_name: "台位3有车任务", stop_before_start: true}
    on_empty: {action: "continue"}
    on_error: {action: "none"}

vehicle_default_rule:
  on_vehicle: {action: "none"}
  on_empty: {action: "none"}
  on_error: {action: "none"}

# 真实YOLO采集点，与云台动作和到点任务并行。manual-detection模式会由launch整体关闭。
detection_points:
  "起始点01": {enabled: true, collect_seconds: 6.0}
  "起始点02": {enabled: true, collect_seconds: 6.0}
  "起始点03": {enabled: true, collect_seconds: 6.0}
  "起始点04": {enabled: true, collect_seconds: 6.0}

sweep_profiles:
  inspection_fast:
    repeat: 1
    steps:
      - {direction: "left",  speed: 10, duration: 1.5, pause: 0.05}
      - {direction: "right", speed: 10, duration: 3.0, pause: 0.05}
      - {direction: "left",  speed: 10, duration: 1.5, pause: 0.05}

  normal:
    repeat: 1
    steps:
      - {direction: "left",  speed: 5, duration: 1.5, pause: 0.10}
      - {direction: "right", speed: 5, duration: 3.0, pause: 0.10}
      - {direction: "left",  speed: 5, duration: 1.5, pause: 0.10}

detection:
  collect_seconds: 6.0

# 留空表示不播报；填写上位机 get_wav_list 返回的真实文件名即可联动。
voice_events:
  task_started: ""
  point_arrived: ""
  vehicle_present: ""
  vehicle_absent: ""
  detection_error: ""
  task_finished: ""
